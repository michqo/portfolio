<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Dark background -->
  <rect width="32" height="32" rx="6" fill="#171717"/>
  <!-- Subtle dot grid -->
  <defs>
    <pattern id="dots" x="0" y="0" width="8" height="8" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="0.65" fill="rgba(255,255,255,0.07)"/>
    </pattern>
  </defs>
  <rect width="32" height="32" rx="6" fill="url(#dots)"/>
  <!-- Cyan-blue left accent bar -->
  <rect x="0" y="0" width="3" height="32" rx="1.5" fill="#0ea5c9"/>
  <!-- / in cyan-blue -->
  <text x="7" y="22" font-family="ui-monospace,monospace" font-size="15" font-weight="700" fill="#0ea5c9">/</text>
  <!-- m in white -->
  <text x="16" y="22" font-family="ui-monospace,monospace" font-size="15" font-weight="700" fill="#ffffff">m</text>
</svg>
